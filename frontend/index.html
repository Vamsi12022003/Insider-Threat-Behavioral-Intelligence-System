<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Insider Threat Behavioral Intelligence System</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6fb;
    margin: 0;
    padding: 60px 20px;
    color: #1e293b;
  }
  .page-title {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 8px;
  }
  .page-subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 40px;
  }
  .badge-row {
    text-align: center;
    margin-bottom: 40px;
  }
  .badge {
    display: inline-block;
    color: #2563eb;
    font-weight: 600;
    font-size: 1.1rem;
  }
  .badge-sub {
    text-align: center;
    color: #64748b;
    margin-top: 4px;
    margin-bottom: 40px;
  }
  .login-card {
    max-width: 420px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08);
    padding: 32px;
    border: 1px solid #e2e8f0;
  }
  .login-card h2 {
    text-align: center;
    color: #2563eb;
    margin-top: 0;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #334155;
    margin-bottom: 4px;
    margin-top: 14px;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #2563eb;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 22px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .toggle {
    text-align: center;
    margin-top: 16px;
    cursor: pointer;
    color: #2563eb;
    font-size: 0.9rem;
  }
  #message { text-align: center; margin-top: 14px; font-weight: 600; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="page-title">Insider Threat Behavioral Intelligence System</div>
<div class="page-subtitle">Behavioral intelligence for proactive insider-threat monitoring</div>

<div class="badge-row">
  <span class="badge">&#128274; Behavioral Intelligence Analysis Platform</span>
  <div class="badge-sub">Advanced insider threat detection using machine learning</div>
</div>

<div class="login-card">
  <h2 id="formTitle">Login to Your Account</h2>
  <div id="loginForm">
    <label for="loginUsername">Username or Email</label>
    <input type="text" id="loginUsername" placeholder="Username">
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
  <div id="registerForm" class="hidden">
    <label for="regUsername">Username</label>
    <input type="text" id="regUsername" placeholder="Username">
    <label for="regEmail">Email</label>
    <input type="email" id="regEmail" placeholder="Email">
    <label for="regPassword">Password</label>
    <input type="password" id="regPassword" placeholder="Password">
    <label for="regRole">Role</label>
    <select id="regRole">
      <option value="security_analyst">Security Analyst</option>
      <option value="soc_engineer">SOC Engineer</option>
      <option value="security_manager">Security Manager</option>
      <option value="admin">Admin</option>
    </select>
    <button onclick="register()">Register</button>
  </div>
  <div class="toggle" onclick="toggleForm()">
    <span id="toggleText">Need an account? Register</span>
  </div>
  <div id="message"></div>
</div>

<script>
  const API_BASE = "http://127.0.0.1:8000";
  let showingLogin = true;
  function toggleForm() {
    showingLogin = !showingLogin;
    document.getElementById("loginForm").classList.toggle("hidden");
    document.getElementById("registerForm").classList.toggle("hidden");
    document.getElementById("formTitle").innerText = showingLogin ? "Login to Your Account" : "Create Your Account";
    document.getElementById("toggleText").innerText = showingLogin
      ? "Need an account? Register"
      : "Already have an account? Login";
    document.getElementById("message").innerText = "";
  }
  async function register() {
    const username = document.getElementById("regUsername").value;
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;
    const role = document.getElementById("regRole").value;
    try {
      const res = await fetch(`${API_BASE}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password, role })
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById("message").style.color = "green";
        document.getElementById("message").innerText = "Registered! You can now log in.";
        toggleForm();
      } else {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText = data.detail || "Registration failed.";
      }
    } catch (err) {
      document.getElementById("message").style.color = "red";
      document.getElementById("message").innerText = "Could not reach server. Is the backend running?";
    }
  }
  async function login() {
    const username = document.getElementById("loginUsername").value;
    const password = document.getElementById("loginPassword").value;
    try {
      const formData = new URLSearchParams();
      formData.append("username", username);
      formData.append("password", password);
      const res = await fetch(`${API_BASE}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem("access_token", data.access_token);
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText = data.detail || "Login failed.";
      }
    } catch (err) {
      document.getElementById("message").style.color = "red";
      document.getElementById("message").innerText = "Could not reach server. Is the backend running?";
    }
  }
</script>
</body>
</html>
