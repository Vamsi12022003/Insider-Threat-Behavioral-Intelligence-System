<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Insider Threat Dashboard</title>
<style>
  body { background:#0d1117; color:#c9d1d9; font-family:'Segoe UI',sans-serif; margin:0; padding:0; }
  header { background:#161b22; border-bottom:1px solid #30363d; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { color:#58a6ff; font-size:20px; margin:0; }
  .userbox { display:flex; align-items:center; gap:12px; font-size:13px; color:#8b949e; }
  .role-badge { background:#1f6feb; color:white; padding:3px 10px; border-radius:12px; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
  .logout-btn { background:#21262d; color:#c9d1d9; border:1px solid #30363d; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
  .logout-btn:hover { background:#30363d; }
  nav { display:flex; gap:8px; padding:12px 24px; background:#0d1117; border-bottom:1px solid #30363d; }
  nav button { background:#161b22; color:#c9d1d9; border:1px solid #30363d; padding:8px 16px; border-radius:6px; cursor:pointer; }
  nav button.active { background:#1f6feb; color:white; border-color:#1f6feb; }
  main { padding:24px; }
  .tab { display:none; }
  .tab.active { display:block; }
  .summary { display:flex; gap:16px; margin-bottom:24px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px 24px; flex:1; text-align:center; }
  .card h2 { margin:0; font-size:28px; }
  .Low h2 { color:#3fb950; }
  .Medium h2 { color:#d29922; }
  .High h2 { color:#f85149; }
  .Critical h2 { color:#ff6b81; }
  table { width:100%; border-collapse:collapse; background:#161b22; border:1px solid #30363d; }
  th,td { padding:10px; text-align:left; border-bottom:1px solid #30363d; }
  th { color:#58a6ff; }
  tr:hover { background:#1c2128; }
  input[type=text],input[type=file] { padding:8px; margin-bottom:12px; width:280px; background:#0d1117; color:#c9d1d9; border:1px solid #30363d; border-radius:4px; }
  button.action { background:#1f6feb; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; }
  button.small-action { background:#21262d; color:#c9d1d9; border:1px solid #30363d; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; }
  button.small-action:hover { background:#30363d; }
  .status-tag { padding:2px 8px; border-radius:4px; font-size:12px; }
  .investigating { background:#3d2e0a; color:#d29922; }
  .resolved { background:#0f2d1f; color:#3fb950; }
  .open { background:#1c2128; color:#8b949e; }
  .acknowledged { background:#0d2438; color:#58a6ff; }
  .sev-Critical { background:#3d0e14; color:#ff6b81; }
  .sev-High { background:#3d2e0a; color:#f85149; }
  pre { white-space:pre-wrap; word-break:break-word; }
  .access-denied { color:#8b949e; padding:40px; text-align:center; }
</style>
</head>
<body>

<header>
  <h1>Insider Threat Behavioral Intelligence System</h1>
  <div class="userbox">
    <span id="usernameLabel"></span>
    <span class="role-badge" id="roleLabel"></span>
    <button class="logout-btn" onclick="logout()">Log out</button>
  </div>
</header>

<nav id="navBar"></nav>

<main>

  <div id="predictTab" class="tab">
    <h2>Live CSV Prediction</h2>
    <input type="file" id="csvFile" accept=".csv">
    <br>
    <button class="action" onclick="uploadCSV()">Run Prediction</button>
    <div id="predictResults" style="margin-top:20px;"></div>
  </div>

  <div id="riskTab" class="tab">
    <h2>Insider Risk Scores</h2>
    <div class="summary" id="summary"></div>
    <input type="text" id="searchBox" placeholder="Filter by user...">
    <table>
      <thead><tr><th>User</th><th>Risk Score</th><th>Risk Level</th></tr></thead>
      <tbody id="riskTableBody"></tbody>
    </table>
  </div>

  <div id="incidentsTab" class="tab">
    <h2>Threat Incidents</h2>
    <table>
      <thead><tr><th>Incident ID</th><th>User</th><th>Status</th><th>Anomalous Days</th><th>Notes</th><th>Created</th></tr></thead>
      <tbody id="incidentsTableBody"></tbody>
    </table>
  </div>

  <div id="alertsTab" class="tab">
    <h2>Alerts</h2>
    <div class="summary" id="alertsSummary"></div>
    <button class="action" onclick="generateAlerts()">Scan Risk Scores for New Alerts</button>
    <table style="margin-top:16px;">
      <thead><tr><th>Alert ID</th><th>User</th><th>Severity</th><th>Message</th><th>Status</th><th>Created</th><th>Action</th></tr></thead>
      <tbody id="alertsTableBody"></tbody>
    </table>
  </div>

</main>

<script>
const API_BASE = "http://127.0.0.1:8000";

// ---- Auth / Role gating ----
// Tabs each role is allowed to see. Matches the free-text role strings
// issued at registration and enforced server-side in rbac.py.
const ROLE_TABS = {
  security_analyst: ["predictTab", "riskTab", "incidentsTab", "alertsTab"],
  security_manager: ["riskTab", "alertsTab"],
  admin:            ["predictTab", "riskTab", "incidentsTab", "alertsTab"],
};
const TAB_LABELS = {
  predictTab: "Predict",
  riskTab: "Risk Scores",
  incidentsTab: "Incidents",
  alertsTab: "Alerts",
};

function decodeJwtPayload(token) {
  try {
    const base64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(base64))));
  } catch (e) {
    return null;
  }
}

function logout() {
  localStorage.removeItem("access_token");
  window.location.href = "index.html";
}

const token = localStorage.getItem("access_token");
if (!token) {
  window.location.href = "index.html";
}
const claims = token ? decodeJwtPayload(token) : null;
if (!claims || !claims.role) {
  logout();
}
const currentRole = claims.role;
const allowedTabs = ROLE_TABS[currentRole] || [];

document.getElementById("usernameLabel").textContent = claims.sub || "";
document.getElementById("roleLabel").textContent = currentRole.replace("_", " ");

// Build nav dynamically from whatever this role is allowed to see
const navBar = document.getElementById("navBar");
if (allowedTabs.length === 0) {
  document.querySelector("main").innerHTML =
    `<div class="access-denied">Your role ('${currentRole}') has no dashboard views assigned. Contact an administrator.</div>`;
} else {
  allowedTabs.forEach((tabId, i) => {
    const btn = document.createElement("button");
    btn.className = "tabBtn" + (i === 0 ? " active" : "");
    btn.dataset.tab = tabId;
    btn.textContent = TAB_LABELS[tabId];
    navBar.appendChild(btn);
  });
  document.querySelectorAll(".tabBtn").forEach((btn, i) => {
    if (i === 0) document.getElementById(btn.dataset.tab).classList.add("active");
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tabBtn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });

  // Only load data for tabs this role can actually see
  if (allowedTabs.includes("riskTab")) { loadSummary(); loadRiskScores(); }
  if (allowedTabs.includes("incidentsTab")) { loadIncidents(); }
  if (allowedTabs.includes("alertsTab")) { loadAlerts(); loadAlertsSummary(); }
}

// ---- Risk Scores ----
async function loadSummary() {
  const res = await fetch(`${API_BASE}/risk-scores/summary`);
  const data = await res.json();
  const summaryDiv = document.getElementById("summary");
  summaryDiv.innerHTML = "";
  for (const [level, count] of Object.entries(data)) {
    summaryDiv.innerHTML += `<div class="card ${level}"><h2>${count}</h2><p>${level}</p></div>`;
  }
}

async function loadRiskScores() {
  const res = await fetch(`${API_BASE}/risk-scores`);
  const data = await res.json();
  renderRiskTable(data);
  document.getElementById("searchBox").addEventListener("input", (e) => {
    const filtered = data.filter(row => row.user.toLowerCase().includes(e.target.value.toLowerCase()));
    renderRiskTable(filtered);
  });
}

function renderRiskTable(rows) {
  const tbody = document.getElementById("riskTableBody");
  tbody.innerHTML = "";
  rows.forEach(row => {
    tbody.innerHTML += `<tr>
      <td>${row.user}</td>
      <td>${row.insider_risk_score ?? "-"}</td>
      <td>${row.risk_category ?? "-"}</td>
    </tr>`;
  });
}

// ---- Incidents ----
async function loadIncidents() {
  const res = await fetch(`${API_BASE}/incidents`);
  const data = await res.json();
  const tbody = document.getElementById("incidentsTableBody");
  tbody.innerHTML = "";
  data.forEach(row => {
    tbody.innerHTML += `<tr>
      <td>${row.incident_id}</td>
      <td>${row.user}</td>
      <td><span class="status-tag ${row.status}">${row.status}</span></td>
      <td>${row.anomalous_day_count}</td>
      <td>${row.notes ?? ""}</td>
      <td>${new Date(row.created_at).toLocaleString()}</td>
    </tr>`;
  });
}

// ---- Predict ----
async function uploadCSV() {
  const fileInput = document.getElementById("csvFile");
  if (!fileInput.files.length) { alert("Choose a CSV file first."); return; }
  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  const res = await fetch(`${API_BASE}/predict`, { method: "POST", body: formData });
  const data = await res.json();
  const resultsDiv = document.getElementById("predictResults");
  resultsDiv.innerHTML = `<pre style="background:#161b22;padding:16px;border-radius:8px;overflow:auto;">${JSON.stringify(data, null, 2)}</pre>`;
}

// ---- Alerts ----
async function loadAlertsSummary() {
  const res = await fetch(`${API_BASE}/alerts/summary`);
  const data = await res.json();
  const div = document.getElementById("alertsSummary");
  div.innerHTML = "";
  for (const [status, count] of Object.entries(data.by_status || {})) {
    div.innerHTML += `<div class="card"><h2>${count}</h2><p>${status}</p></div>`;
  }
}

async function loadAlerts() {
  const res = await fetch(`${API_BASE}/alerts`);
  const data = await res.json();
  const tbody = document.getElementById("alertsTableBody");
  tbody.innerHTML = "";
  data.forEach(a => {
    const canAct = a.status !== "resolved";
    tbody.innerHTML += `<tr>
      <td>${a.id}</td>
      <td>${a.user}</td>
      <td><span class="status-tag sev-${a.severity}">${a.severity}</span></td>
      <td>${a.message}</td>
      <td><span class="status-tag ${a.status}">${a.status}</span></td>
      <td>${new Date(a.created_at).toLocaleString()}</td>
      <td>
        ${canAct && a.status === "open" ? `<button class="small-action" onclick="updateAlertStatus('${a.id}','acknowledged')">Acknowledge</button>` : ""}
        ${canAct ? `<button class="small-action" onclick="updateAlertStatus('${a.id}','resolved')">Resolve</button>` : ""}
      </td>
    </tr>`;
  });
}

async function updateAlertStatus(alertId, status) {
  await fetch(`${API_BASE}/alerts/${alertId}/status`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status }),
  });
  loadAlerts();
  loadAlertsSummary();
}

async function generateAlerts() {
  const res = await fetch(`${API_BASE}/alerts/generate`, { method: "POST" });
  const data = await res.json();
  alert(`Generated ${data.generated} new alert(s).`);
  loadAlerts();
  loadAlertsSummary();
}
</script>

</body>
</html>
